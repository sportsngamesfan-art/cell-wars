function library(){const t=TOPICS.find(x=>x.id===lesson)||TOPICS[0];const notes={spreadsheet:['Spreadsheet software stores, organises, calculates, manipulates and analyses data in tables.','Rows run horizontally; columns run vertically.','Microsoft Excel is a popular Office spreadsheet app.'],features:['Formulas calculate. Functions are built-in formulas.','Formatting changes appearance; Charts display information graphically.','Automatic recalculation updates formulas if source cells change.','Find and Replace searches/replaces data. Auto Fill extends a series.'],starting:['Start → All apps → Excel → Blank workbook → New workbook opens.'],workbooks:['Workbook = file with worksheets, like a notebook.','Worksheet = rows and columns, like a page.','A new workbook begins as Book1 with Sheet1.','Each worksheet has 1,048,576 rows and 16,384 columns (A to XFD).'],components:['Cell = intersection of row and column; A5 is column A, row 5.','Active cell has a thick green border (cell pointer).','Range C1:C10 is ten adjacent cells.','Name Box shows address; Formula Bar shows contents.','Title Bar shows workbook name; Status Bar is at the bottom.','Each cell can contain 32,767 characters.'],navigation:['Arrow keys move one cell. Page Up / Down move approximately one screen.','Ctrl + Home → A1. Ctrl + End → last used cell.','Ctrl + Page Up / Down switches worksheets.'],entry:['Click a cell, type data, then press Enter or an arrow key.','WEEKLY EXPENSES begins in D1. Merge & Center is Home → Alignment.','Eatables row: 50, 0, 200, 0, 0, 500 = 750.'],data:['Numbers default right alignment; text defaults left alignment.','Excel stores dates and times internally as numbers.','Every formula starts with =.'],formulas:['Operators: addition +, subtraction -, multiplication *, division /.','Example: =A1+B1 or =B3+C3+D3+E3+F3+G3.'],functions:['SUM adds; AVERAGE finds mean; COUNT counts numeric cells; MAX largest; MIN smallest.','AutoSum suggests a sum range on Home and Formulas.'],management:['Add a sheet with + beside sheet tabs.','Delete via right-click sheet tab > Delete.','Rename by double-clicking tab, entering name, pressing Enter.'],saving:['File → Save → Save As / Browse → choose folder → filename → Save.','Excel files end in .xlsx.','Ctrl + S saves, F12 Save As, Ctrl + O Open, F5 Go To, Ctrl + Shift + U expands or collapses Formula Bar.'],facts:['VisiCalc was invented by Dan Bricklin and Bob Frankston.','Page Layout → Background inserts a sheet background image.']};const cards=[['Cell','Row/column intersection'],['Workbook','File holding worksheets'],['Worksheet','Grid for entering data'],['Range','Group of contiguous cells'],['SUM','Adds values'],['MAX','Finds the largest value'],['Ctrl + Home','Goes to A1'],['.xlsx','Excel file extension']];return `${intro('KNOWLEDGE BASE','The learning library.','Learn every concept with compact, accurate revision notes.')}<div class="library-layout"><div class="topic-nav">${TOPICS.map((x,i)=>`<button class="${lesson===x.id?'chosen':''}" onclick="App.topic('${x.id}')"><span>${String(i+1).padStart(2,'0')}</span>${x.title}<span>›</span></button>`).join('')}</div><div><div class="panel lesson"><p class="eyebrow">LESSON · ${t.title.toUpperCase()}</p><h2>${t.title}</h2><p class="muted">${t.description}</p>${notes[t.id].map((l,i)=>`<div class="lesson-point"><b>${String(i+1).padStart(2,'0')}</b><p>${escapeHtml(l)}</p></div>`).join('')}${btn('Test your knowledge',"App.start('quick')")}</div><div class="panel flash-panel"><h2>Flip cards <small>${flash+1} / ${cards.length}</small></h2><button class="flashcard" onclick="App.flip()"><span>${flip?'THE DEFINITION':'WHAT IS...?'}</span><b>${cards[flash][flip?1:0]}</b><small>Tap to flip ↻</small></button><div class="button-row">${btn('Previous',"App.flash(-1)",true)}${btn('Next',"App.flash(1)",true)}</div></div></div></div>`}
function achievements(){return `${intro('TROPHY ROOM','Your achievements.','Small wins deserve a place on the wall.')}<div class="privacy-note"><span class="search-bullet">♛</span><strong>${state.achievements.length} / ${BADGES.length} badges unlocked</strong></div><div class="badge-grid">${BADGES.map((b,i)=>{let earned=state.achievements.includes(b);return `<div class="badge-tile ${earned?'earned':''}"><div>${ICONS[i]}</div><h3>${b}</h3><p>${badgeTriggers[i]>0?`Answer ${badgeTriggers[i]} questions`:['Perfect 10-question quiz','Beat the boss','Complete revision','Finish quest level 10'][i-7]}</p><span>${earned?'✓ UNLOCKED':'LOCKED'}</span></div>`}).join('')}</div>`}
function leaderboard(){return `${intro('SCOREBOARD','Leaderboard.','Real progress only. No fake names or fabricated class rankings.')}<div class="privacy-note"><span class="search-bullet">▣</span><div><b>Local-only leaderboard</b><p>Your scores live on this browser until you connect a secure database. Public class rankings are not yet active.</p></div></div>${state.completed?`<div class="leader-row"><b>#1</b><span class="avatar">${escapeHtml(state.nickname.slice(0,2))}</span><div><strong>${escapeHtml(state.nickname)}</strong><small>${state.completed} quizzes completed</small></div><strong>${state.xp} XP</strong></div>`:`<div class="empty"><span class="sparse-icon">♛</span><h2>No scores yet</h2><p>Finish your first quiz to appear here.</p>${btn('Start a quiz',"App.nav('/modes')")}</div>`}`}
function settings(){return `${intro('PREFERENCES','Make it yours.','No personal information is required.')}<div class="settings-grid"><div class="panel"><h2>Display nickname</h2><p class="muted">Use a safe nickname, not a full name.</p><label>Nickname</label><input class="settings-input" maxlength="18" value="${escapeHtml(state.nickname)}" oninput="App.nickname(this.value)"><p class="subtle">Data is saved only in this browser.</p></div><div class="panel"><h2>Accessibility & privacy</h2><label class="switch">Reduced motion <input type="checkbox" id="reduced" ${localStorage.getItem('cw-reduced')==='true'?'checked':''} onchange="App.motion(this.checked)"></label><label class="switch">Public leaderboard (database phase) <input type="checkbox" disabled></label><label class="switch">Sound (not enabled in this release) <input type="checkbox" disabled></label></div><div class="panel"><h2>Erase saved progress</h2><p class="muted">Remove your nickname, scores, achievements and local session.</p><button class="btn danger" onclick="App.clear()">Erase local data</button></div></div>`}
function friend(){const seed=41372;const url=(location.href.split('?')[0])+'?seed='+seed;return `${intro('FRIEND CHALLENGE','Same questions. Your own pace.','Use a challenge link to play the same question set; no shared scores without a database.')}<div class="panel friend-panel"><h2>Challenge code: CW-${seed}</h2><p>Share this link with a classmate. Your results are saved locally, not broadcast.</p><div class="share-link"><span>${escapeHtml(url)}</span><button class="btn secondary" onclick="App.copy()">Copy link</button></div>${btn('Play this challenge',`App.start('friend',1,${seed})`)}</div>`}
function labCalc(ref,seen=new Set()){if(seen.has(ref))return '#CYCLE!';seen.add(ref);let raw=String(labCells[ref]??'');if(!raw.startsWith('='))return raw;let expr=raw.slice(1).toUpperCase().replace(/\s/g,'');let m=/^(SUM|AVERAGE|COUNT|MAX|MIN)\(([A-H]\d+):([A-H]\d+)\)$/.exec(expr);if(m){let n1=+m[2].slice(1),n2=+m[3].slice(1),c1=m[2].charCodeAt(0),c2=m[3].charCodeAt(0);let nums=[];for(let row=Math.min(n1,n2);row<=Math.max(n1,n2);row++)for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){let val=labCalc(String.fromCharCode(c)+row,new Set(seen));if(String(val).trim()!==''&&Number.isFinite(Number(val)))nums.push(Number(val))}if(m[1]==='COUNT')return nums.length;if(m[1]==='SUM')return nums.reduce((a,b)=>a+b,0);if(!nums.length)return '#DIV/0!';return m[1]==='AVERAGE'?nums.reduce((a,b)=>a+b,0)/nums.length:m[1]==='MAX'?Math.max(...nums):Math.min(...nums)}if(!/^[A-H0-9+*/().-]+$/.test(expr))return '#ERROR!';let exp=expr.replace(/\b[A-H]\d+\b/g,c=>{let n=labCalc(c,new Set(seen));return n!==''&&Number.isFinite(Number(n))?String(Number(n)):'NaN'});if(!/^[\d.()+*/-]+$/.test(exp))return '#ERROR!';let tokens=exp.match(/\d+(?:\.\d+)?|[()+*/-]/g);if(!tokens||tokens.join('')!==exp)return '#ERROR!';let i=0;function factor(){let t=tokens[i++];if(t==='-')return -factor();if(t==='('){let v=add();if(tokens[i++]!==')')throw Error();return v}if(!t||!/^\d/.test(t))throw Error();return +t}function mul(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){let op=tokens[i++];let n=factor();v=op==='*'?v*n:v/n}return v}function add(){let v=mul();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++];v+=(op==='+'?1:-1)*mul()}return v}try{let out=add();return i===tokens.length&&Number.isFinite(out)?Math.round(out*1e8)/1e8:'#ERROR!'}catch{return '#ERROR!'}}
function lab(){const cols='ABCDEFGH'.split('');let val=labCalc(cell);return `${intro('EXPERIMENT ZONE','Formula Lab.','An editable worksheet using the exact Weekly Expenses dataset from your book.')}<div class="lab-layout"><div class="lab-shell"><div class="excel-title"><span class="excel-logo">X</span><strong>Weekly Expenses.xlsx</strong><span>SIMULATOR</span></div><div class="excel-tabs">Home &nbsp;&nbsp; Insert &nbsp;&nbsp; Page Layout &nbsp;&nbsp; Formulas &nbsp;&nbsp; Data &nbsp;&nbsp; Review &nbsp;&nbsp; View</div><div class="formula-bar"><b>${cell}</b><span>ƒx</span><input id="formula-entry" value="${escapeHtml(String(labCells[cell]||''))}" aria-label="Formula bar"><button onclick="App.apply()">✓ Apply</button></div><div class="excel-scroll"><table class="excel-table"><thead><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${Array.from({length:12},(_,idx)=>{let row=idx+1;return `<tr><th>${row}</th>${row===1&&merge?`<td colspan="8"><button style="text-align:center;font-weight:800" onclick="App.select('D1')">WEEKLY EXPENSES</button></td>`:cols.map(c=>{let addr=c+row,v=labCalc(addr);return `<td><button class="${addr===cell?'cell-selected':''} ${row===2?'table-heading':''}" aria-label="Cell ${addr}" onclick="App.select('${addr}')">${escapeHtml(v)}</button></td>`}).join('')}</tr>`}).join('')}</tbody></table></div><div class="excel-bottom">▣ Sheet1 <span>+ New sheet</span><span>Ready</span></div></div><aside class="lab-side"><div class="panel"><p class="eyebrow">ACTIVE CELL</p><h2 class="active-address">${cell}</h2><span class="subtle">Computed value</span><p class="active-result">${escapeHtml(val)||'—'}</p><h3>Try one of these in H3</h3>${['=SUM(B3:G3)','=B3+C3+D3+E3+F3+G3','=AVERAGE(B3:G3)'].map(f=>`<button class="formula-choice" onclick="App.formula('${f}')">${f} →</button>`).join('')}</div><div class="panel"><p class="eyebrow">LAB TOOLS</p><button class="lab-tool" onclick="App.autosum()">▦ AutoSum selected total</button><button class="lab-tool" onclick="App.merge()">▣ ${merge?'Unmerge':'Merge & Center'} title</button><button class="lab-tool" onclick="App.resetLab()">↻ Reset worksheet</button><p class="subtle">Eatables should total <b>750</b>. Try editing B3, then check H3.</p></div></aside></div>`}
function render(){const path=location.pathname;const content=path==='/'?landing():path==='/modes'?modes():path==='/dashboard'?dashboard():path==='/quest'?quests():path==='/quiz'?progressQuiz():path==='/results'?results():path==='/library'?library():path==='/lab'?lab():path==='/leaderboard'?leaderboard():path==='/achievements'?achievements():path==='/settings'?settings():path==='/friend'?friend():landing();document.getElementById('root').innerHTML=`<div class="app ${localStorage.getItem('cw-reduced')==='true'?'reduced-motion':''}">${header()}<main class="${path==='/'?'landing-main':'inner-main wrap'}">${content}</main>${footer()}</div>`}
window.App={nav,start,exam:n=>{examSize=n;render()},choose:v=>{chosen=v;render()},typed:v=>{chosen=v},pair:v=>{pickOrder.push(v);chosen=pickOrder.join('|');render()},undo:()=>{pickOrder.pop();chosen=pickOrder.join('|');render()},cell:(addr,type)=>{if(type==='cell'){chosen=addr}else if(!firstRange||chosen){firstRange=addr;chosen=''}else{const parse=s=>[s.charCodeAt(0),+s.slice(1)];let [c1,r1]=parse(firstRange),[c2,r2]=parse(addr);chosen=String.fromCharCode(Math.min(c1,c2))+Math.min(r1,r2)+':'+String.fromCharCode(Math.max(c1,c2))+Math.max(r1,r2);firstRange=''}render()},submit:()=>{let q=session?.questions[session.index];if(!q||!chosen.trim()||session.feedback)return;session.answers[q.id]=chosen;session.feedback=true;render()},next:()=>{if(!session?.feedback||session.done)return;if(session.index+1===session.questions.length){finish()}else{session.index++;session.feedback=false;chosen='';firstRange='';pickOrder=[];render()}},showHint:()=>{let el=document.getElementById('hint');el.hidden=!el.hidden},topic:t=>{lesson=t;render()},flip:()=>{flip=!flip;render()},flash:d=>{flash=(flash+d+8)%8;flip=false;render()},nickname:n=>{state.nickname=n.replace(/[^A-Za-z0-9 _-]/g,'').slice(0,18)||'PLAYER';save();document.querySelector('.avatar').textContent=state.nickname.slice(0,2)},motion:v=>{localStorage.setItem('cw-reduced',String(v));render()},clear:()=>{if(confirm('Erase all locally saved CELL WARS progress?')){localStorage.removeItem('cw-preview-v2');state={...DEFAULT,history:[],achievements:[],daily:[]};session=null;nav('/')}},copy:()=>{const u=location.href.split('?')[0]+'?seed=41372';navigator.clipboard?.writeText(u).then(()=>alert('Challenge link copied')).catch(()=>prompt('Copy this link:',u))},select:a=>{cell=a;render()},apply:()=>{labCells[cell]=document.getElementById('formula-entry').value;render()},formula:f=>{cell='H3';labCells.H3=f;render()},autosum:()=>{if(!/^H[3-9]$/.test(cell)){alert('Select a total cell H3–H9 first.');return}let row=cell.slice(1);labCells[cell]=`=SUM(B${row}:G${row})`;render()},merge:()=>{merge=!merge;render()},resetLab:()=>{labCells=initialCells();merge=false;render()}};
render();
</script></body></html>
