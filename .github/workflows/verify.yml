name: Verify CELL WARS
on:
  push:
    branches: [feat/academy-upgrade]
  pull_request:
concurrency:
  group: cell-wars-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:bank
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
